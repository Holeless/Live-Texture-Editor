modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/zeeesea/TextureEditorMod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://modrinth.com/mod/livetextureeditor"
logoFile = "assets/textureeditor/icon.png"
authors = "${mod_authors}"
description = '''Edit block, item, entity, and GUI textures directly in-game. Draw with pencil, brush, fill, line tools, export as resource packs, and see changes live - no restart required.'''

[[mixins]]
config = "textureeditor.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
